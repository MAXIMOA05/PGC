<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario post-piloto — Mente Ágil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f6f8; color: #202124; padding: 2rem; }
        .contenedor { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        h1 { color: #58CC02; font-size: 24px; }
        .card { background: #fff; border-radius: 14px; padding: 1.5rem; box-shadow: 0 3px 14px rgba(0,0,0,.08); display: flex; flex-direction: column; gap: 1rem; }
        label { font-size: 14px; font-weight: 600; color: #333; }
        .escala { display: flex; gap: 10px; }
        .escala button { flex: 1; height: 44px; border-radius: 10px; border: 2px solid #e0e0e0; background: #f5f5f5; font-size: 16px; font-weight: 700; cursor: pointer; color: #333; }
        .escala button.seleccionado { background: #58CC02; color: #fff; border-color: #58CC02; }
        textarea { width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #e0e0e0; font-size: 14px; font-family: Arial, sans-serif; resize: vertical; min-height: 80px; }
        textarea:focus { outline: none; border-color: #58CC02; }
        .btn-enviar { background: #58CC02; color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; border-bottom: 3px solid #3a9900; }
        .btn-volver { background: #f5f5f5; color: #333; border: 2px solid #e0e0e0; border-radius: 10px; padding: 10px; font-size: 14px; cursor: pointer; }
        .exito { display: none; text-align: center; padding: 2rem; }
        .exito span { font-size: 48px; }
        .exito h2 { color: #58CC02; margin-top: 1rem; }
        .exito p { color: #555; margin-top: 0.5rem; font-size: 14px; }
        p.sub { font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="contenedor">
        <div>
            <button class="btn-volver" onclick="window.location.href='index.html'">← Volver a Mente Ágil</button>
        </div>

        <div class="card" id="formulario">
            <h1>Cuestionario post-piloto</h1>
            <p style="font-size:13px; color:#555;">Tus respuestas son anónimas y se guardan localmente. Ayudan a mejorar la plataforma.</p>

            <div>
                <label>1. ¿Qué tan probable es que sigas usando Mente Ágil para estudiar?</label>
                <p class="sub">1 = muy poco probable · 5 = muy probable</p>
                <div class="escala" id="escala-uso">
                    <button onclick="seleccionar('escala-uso', 1)">1</button>
                    <button onclick="seleccionar('escala-uso', 2)">2</button>
                    <button onclick="seleccionar('escala-uso', 3)">3</button>
                    <button onclick="seleccionar('escala-uso', 4)">4</button>
                    <button onclick="seleccionar('escala-uso', 5)">5</button>
                </div>
            </div>

            <div>
                <label>2. ¿Qué tan útil te pareció la técnica Pomodoro para organizar tu estudio?</label>
                <p class="sub">1 = nada útil · 5 = muy útil</p>
                <div class="escala" id="escala-pomodoro">
                    <button onclick="seleccionar('escala-pomodoro', 1)">1</button>
                    <button onclick="seleccionar('escala-pomodoro', 2)">2</button>
                    <button onclick="seleccionar('escala-pomodoro', 3)">3</button>
                    <button onclick="seleccionar('escala-pomodoro', 4)">4</button>
                    <button onclick="seleccionar('escala-pomodoro', 5)">5</button>
                </div>
            </div>

            <div>
                <label>3. ¿Qué fue lo que más te gustó de la plataforma?</label>
                <textarea id="pregunta-gusto" placeholder="Escribe tu respuesta aquí..."></textarea>
            </div>

            <div>
                <label>4. ¿Qué mejorarías o qué le falta a la plataforma?</label>
                <textarea id="pregunta-mejora" placeholder="Escribe tu respuesta aquí..."></textarea>
            </div>

            <button class="btn-enviar" onclick="enviarCuestionario()">Enviar respuestas</button>
        </div>

        <div class="exito" id="exito">
            <span>✅</span>
            <h2>¡Gracias por tu respuesta!</h2>
            <p>Tus respuestas fueron guardadas. Son un aporte valioso para mejorar Mente Ágil.</p>
            <button class="btn-volver" style="margin-top:1rem;" onclick="window.location.href='index.html'">Volver a Mente Ágil</button>
        </div>
    </div>

    <script>
        const selecciones = { 'escala-uso': null, 'escala-pomodoro': null }

        function seleccionar(escalaId, valor) {
            selecciones[escalaId] = valor
            const btns = document.getElementById(escalaId).querySelectorAll('button')
            btns.forEach((btn, i) => {
                btn.classList.toggle('seleccionado', i + 1 === valor)
            })
        }

        function enviarCuestionario() {
            if (!selecciones['escala-uso'] || !selecciones['escala-pomodoro']) {
                alert('Por favor responde todas las preguntas de escala antes de enviar.')
                return
            }

            const respuesta = {
                fecha: new Date().toISOString(),
                participante: localStorage.getItem('ma_participante') || 'sin_codigo',
                intension_uso: selecciones['escala-uso'],
                utilidad_pomodoro: selecciones['escala-pomodoro'],
                que_gusto: document.getElementById('pregunta-gusto').value.trim(),
                que_mejorar: document.getElementById('pregunta-mejora').value.trim()
            }

            const respuestas = JSON.parse(localStorage.getItem('ma_postpiloto') || '[]')
            respuestas.push(respuesta)
            localStorage.setItem('ma_postpiloto', JSON.stringify(respuestas))

            document.getElementById('formulario').style.display = 'none'
            document.getElementById('exito').style.display = 'block'
        }
    </script>
</body>
</html>
