<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mente Ágil</title>
</head>

<body>

    <div class="contenedor">
        
        <h1>Mente Ágil</h1>

        <div class="modos">
            <button id="btn-concentracion">Concentración</button>
            <button id="btn-descanso-corto">Descanso corto</button>
            <button id="btn-descanso-largo">Descanso largo</button>
        </div>

        <div class="temporizador">
            <span id="tiempo">25:00</span>
        </div>

        <div class="controles">
            <button id="btn-iniciar">Iniciar</button>
            <button id="btn-reiniciar">Reiniciar</button>
        </div>

        <div class="agregar-tarea">
            <h2>Agregar tarea</h2>
            <input type="text" id="input-tarea" placeholder="Escribe una tarea..."/>
            <select id="input-prioridad">
                <option value="alta">🔴 Alta</option>
                <option value="media">🟡 Media</option>
                <option value="baja">🟢 Baja</option>
            </select>
            <input type="number" id="input-pomodoros" min="1" max="10" value="1"/>
            <button id="btn-agregar">Agregar</button>
        </div>

        <ul id="lista-tareas"></ul>
            <div class="distracciones">
                <p>Distracciones: <span id="contador-distracciones">0</span></p>
                <p id="aviso-distraccion"></p>
            </div>  
    </div>
<script>
    let segundos = 25 * 60
    let corriendo = false
    let intervalo = null

    const display = document.getElementById('tiempo')
    const btnIniciar = document.getElementById('btn-iniciar')
    const btnReiniciar = document.getElementById('btn-reiniciar')

    function mostrarTiempo() {
        let mins = Math.floor(segundos / 60)
        let segs = segundos % 60
        display.textContent = 
            String(mins).padStart(2, '0') + ':' + 
            String(segs).padStart(2, '0')
    }

    btnIniciar.addEventListener('click', function() {
        if (!corriendo) {
            corriendo = true
            btnIniciar.textContent = 'Pausar'
            intervalo = setInterval(function() {
                segundos--
                mostrarTiempo()
                if (segundos <= 0) {
                    clearInterval(intervalo)
                    corriendo = false
                    btnIniciar.textContent = 'Iniciar'
                    alert('¡Tiempo terminado!')
                }
            }, 1000)
        } else {
            corriendo = false
            clearInterval(intervalo)
            btnIniciar.textContent = 'Iniciar'
        }
    })

    btnReiniciar.addEventListener('click', function() {
        clearInterval(intervalo)
        corriendo = false
        segundos = 25 * 60
        btnIniciar.textContent = 'Iniciar'
        mostrarTiempo()
        distracciones = 0
        contadorDistracciones.textContent = '0'
        avisoDistraccion.textContent = ''
    })

const btnConcentracion = document.getElementById('btn-concentracion')
const btnDescansoCorto = document.getElementById('btn-descanso-corto')
const btnDescansoLargo = document.getElementById('btn-descanso-largo')

function cambiarModo(nuevoTiempo) {
    clearInterval(intervalo)
    corriendo = false
    segundos = nuevoTiempo * 60
    btnIniciar.textContent = 'Iniciar'
    mostrarTiempo()
}

btnConcentracion.addEventListener('click', function() {
    cambiarModo(25)
})

btnDescansoCorto.addEventListener('click', function() {
    cambiarModo(5)
})

btnDescansoLargo.addEventListener('click', function() {
    cambiarModo(15)
})

const inputTarea = document.getElementById('input-tarea')
const btnAgregar = document.getElementById('btn-agregar')
const listaTareas = document.getElementById('lista-tareas')

function agregarTarea() {
    const texto = inputTarea.value.trim()
    
    if (texto === '') return
    const prioridad = document.getElementById('input-prioridad').value
    const pomodoros = document.getElementById('input-pomodoros').value

    const colores = { alta: '🔴', media: '🟡', baja: '🟢' }

    const li = document.createElement('li')
    li.innerHTML = `
        <span>${colores[prioridad]} ${texto}</span>
        <span>🍅 ${pomodoros}</span>
        <button class="btn-listo">Listo</button>
    `

    li.querySelector('.btn-listo').addEventListener('click', function() {
        li.style.textDecoration = 'line-through'
        li.style.opacity = '0.5'
    })

    listaTareas.appendChild(li)
    
    inputTarea.value = ''
}

btnAgregar.addEventListener('click', function() {
    agregarTarea()
})

inputTarea.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') agregarTarea()
})
let distracciones = 0
const contadorDistracciones = document.getElementById('contador-distracciones')
const avisoDistraccion = document.getElementById('aviso-distraccion')

document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
        if (corriendo) {
            distracciones++
            contadorDistracciones.textContent = distracciones
        }
    } else {
        if (distracciones > 0) {
            avisoDistraccion.textContent = '⚠️ Te distrajiste ' + distracciones + ' veces en este Pomodoro'
        }
    }
})
</script>
</body>

</html>
